<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · PYTHIA</title>
<link rel="stylesheet" href="/style.css">
<style>
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(440px,100%);padding:34px 32px;background:var(--panel);border:1px solid var(--line2);border-radius:3px;box-shadow:0 24px 90px #000b;display:grid;gap:18px}
.login-brand{display:flex;align-items:center;gap:10px;color:var(--fg)}
.login-brand .tripod-mark{width:30px;height:30px}
.login-brand .brand-name{font:600 22px var(--inscr);letter-spacing:.22em}
.login-card p{margin:0;color:var(--fg2)}
.login-copy{display:grid;gap:7px}
.login-statement{color:var(--fg);font:600 16px/1.5 var(--sans)}
.login-tagline{font:400 15px/1.5 var(--sans)}
.login-google{display:inline-flex;justify-content:center;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--gold);border-radius:3px;background:var(--gold);color:#1a1206;font:600 11px var(--inscr);letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.login-google:hover{filter:brightness(1.08)}
.login-google[aria-disabled="true"]{opacity:.45;pointer-events:none}
.login-error{display:none;padding:10px 12px;border:1px solid var(--terra);border-radius:3px;background:rgba(200,100,59,.08);color:var(--fg)}
.login-error.show{display:block}
.login-dev{display:none;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.login-dev.show{display:grid}
.login-dev label{display:grid;gap:7px;color:var(--fg3);font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.login-dev select{max-width:none;padding:9px 10px;font-size:12px}
.login-dev button{padding:10px 14px;border:1px solid var(--line2);border-radius:3px;background:var(--raise);font:600 11px var(--inscr);letter-spacing:.12em;text-transform:uppercase}
.login-dev button:hover{border-color:var(--gold)}
.login-note{font:500 15px var(--verse);color:var(--fg3)}
</style>
</head>
<body>
<main class="login">
  <section class="login-card">
    <div class="login-brand">
      <svg class="tripod-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 9h20M8 9c0 5 3 8 8 8s8-3 8-8M11 16 7 29M21 16l4 13M16 17v12M13 5c0-2 1.5-3 3-3M19 6c0-2-1-3-2-3"/></svg>
      <span class="brand-name">PYTHIA</span>
    </div>
    <div class="login-copy">
      <p class="login-statement">An Oracle That Knows What We Know.</p>
      <p id="login-lead" class="login-tagline">Your gateway to collective wisdom.</p>
    </div>
    <div id="login-error" class="login-error" role="alert"></div>
    <a id="login-google" class="login-google" href="/auth/login">Sign in with Google</a>
    <form id="login-dev" class="login-dev">
      <label>Demo persona (development login)
        <select id="login-persona" aria-label="Choose a demo persona"></select>
      </label>
      <button type="submit">Continue as persona</button>
    </form>
    <p id="login-note" class="login-note">Exclusively for T1Aers.</p>
  </section>
</main>
<script src="/login.js"></script>
</body>
</html>
